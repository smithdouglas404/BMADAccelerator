# The public door for assistants on the web (Meta Muse, claude.ai, ChatGPT).
# The Studio has no sign-in of its own, so the internet must never reach its screens or its other
# routes. Only the connector's own addresses pass; everything else is a plain 404. Each of those is
# protected by the connector's own sign-in (a token, or a one-time connect code).
worker_processes 1;
events { worker_connections 256; }
http {
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=door:10m rate=10r/s;
  limit_req_status 429;
  # The tunnel tells us it was https; keep that so the OAuth addresses come out right.
  map $http_x_forwarded_proto $proto { default $http_x_forwarded_proto; "" https; }

  server {
    listen 8080;
    client_max_body_size 1m;
    limit_req zone=door burst=30 nodelay;

    # MCP connector, REST API (+ its OpenAPI description), OAuth, and the sign-in page's own files.
    location = /api/mcp          { include /etc/nginx/pass.conf; }
    location ^~ /api/v1/         { include /etc/nginx/pass.conf; }
    location ^~ /api/oauth/      { include /etc/nginx/pass.conf; }
    location ^~ /oauth/          { include /etc/nginx/pass.conf; }
    location ^~ /.well-known/    { include /etc/nginx/pass.conf; }
    location ^~ /_next/static/   { include /etc/nginx/pass.conf; }

    location / { return 404; }
  }
}
