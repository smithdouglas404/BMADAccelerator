# Public door for generated apps. Hostname p4101.innume.com -> the Studio container's port 4101
# (only 4100-4129 allowed). The Studio's own screens are NOT served here.
worker_processes 1;
events { worker_connections 256; }
http {
  server_tokens off;
  resolver 127.0.0.11 valid=10s;
  map $http_upgrade $conn_up { default upgrade; "" close; }
  server {
    listen 8080;
    server_name ~^p(?<pport>41[0-2][0-9])\.innume\.com$;
    location / {
      proxy_pass http://app:$pport;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $conn_up;
      proxy_read_timeout 300s;
    }
  }
  # Nasiko's own dashboard (Settings > Enterprise Harness > Open Nasiko): p8480.<domain> -> Nasiko on this computer's port 8480.
  # Put Cloudflare Access (email sign-in) in front of this hostname BEFORE restarting this router: the Studio has no sign-in of its own,
  # so without it Nasiko's password is the only lock on a runtime that holds the Docker socket.
  server {
    listen 8080;
    server_name ~^p8480\.innume\.com$;
    location / {
      proxy_pass http://host.docker.internal:8480;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $conn_up;
      proxy_read_timeout 300s;
    }
  }
  server { listen 8080 default_server; location / { return 404; } }
}
