# The door with the Studio's screens open too, behind the Studio's own sign-in (Clerk).
# The Studio has no login of its own in its screens and holds the owner's keys, so every page that is not
# the connector asks /api/auth/check first. That answers yes only for a signed-in person on the allowed
# email list; with no keys or no list it says no. Assistants still reach /api/v1, /api/mcp and the OAuth
# addresses with their own token.
worker_processes 1;
events { worker_connections 256; }
http {
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=door:10m rate=20r/s;
  limit_req_status 429;
  map $http_x_forwarded_proto $proto { default $http_x_forwarded_proto; "" https; }
  map $http_upgrade $conn { default upgrade; "" close; }

  server {
    listen 8080;
    client_max_body_size 50m;
    limit_req zone=door burst=60 nodelay;

    # Assistants: their own token or connect code protects these.
    location = /api/mcp          { include /etc/nginx/pass.conf; }
    location ^~ /api/v1/         { include /etc/nginx/pass.conf; }
    location ^~ /api/oauth/      { include /etc/nginx/pass.conf; }
    location ^~ /oauth/          { include /etc/nginx/pass.conf; }
    location ^~ /.well-known/    { include /etc/nginx/pass.conf; }
    location ^~ /_next/static/   { include /etc/nginx/pass.conf; }

    # The sign-in page itself, and the checker it relies on.
    location ^~ /sign-in         { include /etc/nginx/pass.conf; }
    location = /favicon.ico      { include /etc/nginx/pass.conf; }

    # Asked for every other request. Never reachable from outside (internal).
    location = /_auth {
      internal;
      proxy_pass http://app:3000/api/auth/check;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $proto;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Authorization $http_authorization;
    }

    # Everything else: the screens and the Studio's own API.
    location / {
      auth_request /_auth;
      error_page 401 = @signin;
      include /etc/nginx/pass.conf;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $conn;
    }
    location @signin { return 302 /sign-in; }
  }
}
