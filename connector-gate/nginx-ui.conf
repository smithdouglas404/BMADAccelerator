# The door with the Studio's screens open too. ONLY use this when Cloudflare Access (or another login)
# sits in front of the hostname, because the Studio has no sign-in of its own and holds the owner's keys.
# Assistants still reach /api/v1, /api/mcp and the OAuth addresses with their own token; Access is set to
# let exactly those paths through, and everything else needs the owner's Access sign-in.
worker_processes 1;
events { worker_connections 256; }
http {
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=door:10m rate=20r/s;
  limit_req_status 429;
  map $http_x_forwarded_proto $proto { default $http_x_forwarded_proto; "" https; }
  map $http_upgrade $conn { default upgrade; "" close; }

  server {
    listen 8080;
    client_max_body_size 50m;
    limit_req zone=door burst=60 nodelay;
    location / {
      include /etc/nginx/pass.conf;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $conn;
    }
  }
}
