services:
  db:
    # Postgres 16 with pgvector, which Mem0 and Letta need. Same data format as postgres:16.
    image: pgvector/pgvector:0.8.7-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bacc
      POSTGRES_PASSWORD: bacc
      POSTGRES_DB: bacc
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bacc"]
      interval: 5s
      retries: 10

  # One-shot: creates the mem0, mem0_app and letta databases in the same Postgres.
  db-setup:
    image: pgvector/pgvector:0.8.7-pg16
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: bacc
      PGPASSWORD: bacc
      PGDATABASE: bacc
    volumes:
      - ./memory/db/setup.sh:/setup.sh:ro
    entrypoint: ["/bin/sh", "/setup.sh"]
    restart: "no"

  # Long-term memory: self-hosted Mem0 (open source).
  mem0:
    build: ./memory/mem0
    restart: unless-stopped
    depends_on:
      db-setup:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: mem0
      POSTGRES_USER: bacc
      POSTGRES_PASSWORD: bacc
      APP_DB_NAME: mem0_app
      HISTORY_DB_PATH: /app/history/history.db
      ADMIN_API_KEY: ${MEM0_ADMIN_API_KEY:?run scripts/memory-secrets.sh once to create the memory passwords}
      JWT_SECRET: ${MEM0_JWT_SECRET:?run scripts/memory-secrets.sh once to create the memory passwords}
      # Same models as Doug's other Mem0: OpenAI gpt-5-mini (Mem0's own default) for fact extraction,
      # text-embedding-3-small (1536 dims, pgvector's default) for embeddings.
      OPENAI_API_KEY: ${OPENAI_API_KEY:?add OPENAI_API_KEY to .env (Mem0 and Letta use it for embeddings)}
      MEM0_DEFAULT_LLM_MODEL: ${MEM0_DEFAULT_LLM_MODEL:-gpt-5-mini}
      MEM0_DEFAULT_EMBEDDER_MODEL: ${MEM0_DEFAULT_EMBEDDER_MODEL:-text-embedding-3-small}
      MEM0_TELEMETRY: "false"
    volumes:
      - mem0-history:/app/history

  # Each Studio agent's working mind: self-hosted Letta (open source).
  letta:
    image: letta/letta:0.16.8
    restart: unless-stopped
    depends_on:
      db-setup:
        condition: service_completed_successfully
    environment:
      LETTA_PG_URI: postgresql://bacc:bacc@db:5432/letta
      # Claude for each role's thinking, OpenAI text-embedding-3-small for its archive.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SECURE: "true"
      LETTA_SERVER_PASSWORD: ${LETTA_SERVER_PASSWORD:?run scripts/memory-secrets.sh once to create the memory passwords}

  # The shared agent service (CLAUDE.md, "Agent memory: Mem0 + Letta"): every product's agents run here as
  # configuration, on Inngest AgentKit, each with a Letta persona and Mem0 memory scoped per customer and
  # use case. Generated apps call it with their own app token and hold no model keys.
  agents:
    build: ./agent-service
    restart: unless-stopped
    depends_on:
      db-setup:
        condition: service_completed_successfully
    environment:
      AGENT_SERVICE_DATABASE_URL: postgresql://bacc:bacc@db:5432/agents
      AGENT_SERVICE_ADMIN_KEY: ${AGENT_SERVICE_ADMIN_KEY:?run scripts/memory-secrets.sh once to create the service passwords}
      INNGEST_DEV: "1"
      INNGEST_BASE_URL: http://inngest:8288
      MEM0_BASE_URL: http://mem0:8000
      MEM0_API_KEY: ${MEM0_ADMIN_API_KEY:-}
      LETTA_BASE_URL: http://letta:8283
      LETTA_SERVER_PASSWORD: ${LETTA_SERVER_PASSWORD:-}
      AGENT_SERVICE_LETTA_MODEL: ${BACC_LETTA_MODEL:-anthropic/claude-haiku-5-5}
      # Model keys for the agents. Keys saved on the Studio's Settings page are also sent here by the Studio.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      # The approval page and run history: http://localhost:8300/ui
      - "8300:8300"

  # Inngest's local server: runs the agents durably, so a run waiting days for an approval survives restarts.
  inngest:
    image: inngest/inngest:v1.52.0
    restart: unless-stopped
    command: ["inngest", "dev", "-u", "http://agents:8300/api/inngest", "--no-discovery"]
    ports:
      - "8288:8288"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mem0:
        condition: service_started
      letta:
        condition: service_started
    ports:
      - "3000:3000"
      # Each use case's generated app gets its own port, so its own link.
      # Change the range in .env if another program already uses one of these ports.
      - "${BACC_PREVIEW_PORT_BASE:-4100}-${BACC_PREVIEW_PORT_LAST:-4129}:${BACC_PREVIEW_PORT_BASE:-4100}-${BACC_PREVIEW_PORT_LAST:-4129}"
    environment:
      DATABASE_URL: postgresql://bacc:bacc@db:5432/bacc
      BACC_PREVIEW_PORT_BASE: ${BACC_PREVIEW_PORT_BASE:-4100}
      BACC_PREVIEW_PORT_LAST: ${BACC_PREVIEW_PORT_LAST:-4129}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_STT_MODEL: ${ELEVENLABS_STT_MODEL:-scribe_v1}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Your Claude subscription for the agents, Generate and the document agent (claude setup-token).
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      BACC_CLAUDE_AUTH: ${BACC_CLAUDE_AUTH:-}
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      MEM0_BASE_URL: http://mem0:8000
      MEM0_API_KEY: ${MEM0_ADMIN_API_KEY:-}
      LETTA_BASE_URL: http://letta:8283
      LETTA_API_KEY: ${LETTA_SERVER_PASSWORD:-}
      # The shared agent service. Previews reach it as http://agents:8300 too.
      AGENT_SERVICE_URL: http://agents:8300
      AGENT_SERVICE_PUBLIC_URL: ${AGENT_SERVICE_PUBLIC_URL:-http://localhost:8300}
      # The Studio's public address (a tunnel or your domain), for the MCP connector and OAuth. Empty = this computer only.
      STUDIO_PUBLIC_URL: ${STUDIO_PUBLIC_URL:-}
      AGENT_SERVICE_ADMIN_KEY: ${AGENT_SERVICE_ADMIN_KEY:-}
      BACC_MODEL: ${BACC_MODEL:-claude-sonnet-5-5}
      BACC_DOC_MODEL: ${BACC_DOC_MODEL:-claude-haiku-5-5}
      BACC_GENERATE_MODEL: ${BACC_GENERATE_MODEL:-}
      BACC_LETTA_MODEL: ${BACC_LETTA_MODEL:-anthropic/claude-haiku-5-5}
      BACC_LETTA_EMBEDDING: ${BACC_LETTA_EMBEDDING:-}
      # AI images in generated apps (OpenAI image model, a few cents each). BACC_IMAGES=off turns them off.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BACC_IMAGES: ${BACC_IMAGES:-}
      BACC_IMAGE_MODEL: ${BACC_IMAGE_MODEL:-gpt-image-2}
      BACC_IMAGE_QUALITY: ${BACC_IMAGE_QUALITY:-medium}
      BACC_IMAGE_LIMIT: ${BACC_IMAGE_LIMIT:-12}
      BACC_SHADCN_MCP: ${BACC_SHADCN_MCP:-}
      BACC_APP_LLM: ${BACC_APP_LLM:-openai}
      BACC_APP_MODEL: ${BACC_APP_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Keys and models can also be set on Settings > Models and keys (stored encrypted; BACC_SECRET
      # is the encryption secret, or one is made on the workspaces volume).
      BACC_SECRET: ${BACC_SECRET:-}
      # Partner shadcn registries the advisor searches: a list, "all" or "off".
      BACC_SHADCN_REGISTRIES: ${BACC_SHADCN_REGISTRIES:-}
    volumes:
      - workspaces:/data/workspaces
      # The agents' session history, so conversations resume after a rebuild.
      - claude-home:/home/node/.claude
    shm_size: "512m"

volumes:
  db:
  workspaces:
  claude-home:
  mem0-history:
